<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Blog</title>

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Questrial&display=swap" rel="stylesheet" />

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v6.5.1/css/all.css" />

  <!-- Lenis CSS -->
  <link rel="stylesheet" href="https://unpkg.com/lenis@1.3.16/dist/lenis.css" />

  <!-- CSS -->
  <link rel="stylesheet" href="Assets/styles.css" />
  <link rel="stylesheet" href="./style.css" />
</head>

<body>
  <header class="--container hero">
    <div class="hero__inner">
      <h1 class="h1">Blog</h1>
      <div class="hero__divider" aria-hidden="true"></div>
      <p>
        Discover insights, ideas, and inspiration from our blog—covering design,
        branding, and digital strategies that drive meaningful results.
      </p>
    </div>
  </header>

  <main class="container">
    <section class="carousel-shell">
      <div class="carousel-top">
        <button id="prevPageBtn" class="btn">◀</button>
        <div class="muted" id="pageInfo">Page 1</div>
        <button id="nextPageBtn" class="btn">▶</button>
      </div>

      <div id="cardsRow" class="cards-3col"></div>

      <nav id="pagination" class="pagination"></nav>
    </section>
  </main>

  <footer id="menu">
    <div id="menuhopin">
      <nav class="footerMenu glassmorphism">
        <a class="footerMenu__link" href="index.html">Home</a>
        <a class="footerMenu__link" href="index.html#services">Services</a>
        <a class="footerMenu__link" href="projects.html">Projects</a>
        <a class="footerMenu__link" href="blog.html" aria-current="page">Blog</a>
        <a class="footerMenu__link" href="contact.html">Contact Me</a>
      </nav>
    </div>
  </footer>

  <!-- Lenis JS -->
  <script src="https://unpkg.com/lenis@1.3.16/dist/lenis.min.js" defer></script>

  <!-- All scripts deferred to avoid timing issues -->
  <script src="Assets/footer.js" defer></script>
  <script src="./script.js" defer></script>
  <script src="Assets/blogs-data.js" defer></script>
  <script src="Assets/blog-list.js" defer></script>

  <!-- Page behavior -->
  <script defer>
    document.addEventListener("DOMContentLoaded", () => {
      // Show/hide footer menu on scroll
      const menuhopin = document.getElementById("menuhopin");
      const onScroll = () => {
        if (!menuhopin) return;
        if (window.scrollY > 80) menuhopin.classList.add("headershow");
        else menuhopin.classList.remove("headershow");
      };
      document.addEventListener("scroll", onScroll, { passive: true });
      onScroll(); // set initial state

      // Lenis smooth scrolling
      if (window.Lenis) {
        const lenis = new Lenis({
          duration: 1.2,
          easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
          direction: "vertical",
          gestureDirection: "vertical",
          smooth: true,
          wheelMultiplier: 1,
          touchMultiplier: 2,
          infinite: false,
        });

        const raf = (time) => {
          lenis.raf(time);
          requestAnimationFrame(raf);
        };
        requestAnimationFrame(raf);
      }
    });
  </script>
</body>

</html>
