<!-- old Code -->

  <!-- Navigation Menu Script -->
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      document.addEventListener('scroll', function () {
        let y = window.scrollY;
        let menuhopin = document.getElementById('menuhopin');
        if (y > 80) { // adjust scroll threshold
          menuhopin.classList.add('headershow');
        } else {
          menuhopin.classList.remove('headershow');
        }
      });
    });
  </script>
  <!-- 1. Include the Lenis library -->
  <script src="https://unpkg.com/lenis@1.3.16/dist/lenis.min.js"></script>

  <!-- 2. Initialize and run Lenis -->
  <script>
    // Initialize Lenis with basic options
    const lenis = new Lenis({
      duration: 1.2,
      easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)), // default easing function
      direction: 'vertical', // vertical, horizontal
      gestureDirection: 'vertical', // vertical, horizontal, both
      smooth: true,
      wheelMultiplier: 1,
      touchMultiplier: 2,
      infinite: false,
    });

    // Use requestAnimationFrame (raf) loop to constantly update the scroll animation
    function raf(time) {
      lenis.raf(time);
      requestAnimationFrame(raf);
    }

    // Start the animation frame loop
    requestAnimationFrame(raf);

    // Optional: Listen for scroll events to log data or trigger other actions
    lenis.on('scroll', (e) => {
      // console.log(e);
    });
  </script>
