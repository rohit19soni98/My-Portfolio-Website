<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Blog</title>

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Questrial&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v6.5.1/css/all.css">
  <link rel="stylesheet" href="https://unpkg.com/lenis@1.3.16/dist/lenis.css">
  <!-- CSS -->
  <link rel="stylesheet" href="Assets/styles.css" />
  <link rel="stylesheet" href="./app.css" />
</head>

<body>

  <header class="container">
    <h1>Blog</h1>
    <p class="muted">Latest posts</p>
  </header>

  <main class="container">
    <section class="carousel-shell">
      <div class="carousel-top">
        <button id="prevPageBtn" class="btn" aria-label="Previous page">◀</button>
        <div class="muted" id="pageInfo">Page 1</div>
        <button id="nextPageBtn" class="btn" aria-label="Next page">▶</button>
      </div>

      <div id="cardsRow" class="cards-3col"></div>

      <nav id="pagination" class="pagination"></nav>
    </section>
  </main>

  <script src="Assets/blogs-data.js"></script>
  <script src="Assets/blog-list.js"></script>
  <!-- Sticky Bottom Footer Menu (outside footer grid) -->
  <nav id="menuhopin" class="footerMenu glassmorphism" aria-label="Footer menu">
    <a class="footerMenu__link" href="index.html">Home</a>
    <a class="footerMenu__link" href="index.html#services">Services</a>
    <a class="footerMenu__link" href="index.html#projects">Projects</a>
    <a class="footerMenu__link" href="blog.html">Blog</a>
    <a class="footerMenu__link" href="contact.html">Contact Me</a>
  </nav>

  <script src="Assets/footer.js"></script>
  <script src="./script.js" defer></script>

  <!-- 1. Include the Lenis library -->
  <script src="https://unpkg.com/lenis@1.3.16/dist/lenis.min.js"></script>

  <!-- 2. Initialize and run Lenis -->
  <script>
    // Initialize Lenis with basic options
    const lenis = new Lenis({
      duration: 1.2,
      easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)), // default easing function
      direction: 'vertical', // vertical, horizontal
      gestureDirection: 'vertical', // vertical, horizontal, both
      smooth: true,
      wheelMultiplier: 1,
      touchMultiplier: 2,
      infinite: false,
    });

    // Use requestAnimationFrame (raf) loop to constantly update the scroll animation
    function raf(time) {
      lenis.raf(time);
      requestAnimationFrame(raf);
    }

    // Start the animation frame loop
    requestAnimationFrame(raf);

    // Optional: Listen for scroll events to log data or trigger other actions
    lenis.on('scroll', (e) => {
      // console.log(e);
    });
  </script>

</body>

</html>
