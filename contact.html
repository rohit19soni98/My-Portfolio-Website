<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact Me</title>

<!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Questrial&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v6.5.1/css/all.css">
  <link rel="stylesheet" href="https://unpkg.com/lenis@1.3.16/dist/lenis.css">
  
  <!-- CSS -->
  <link rel="stylesheet" href="Assets/styles.css" />
  <link rel="stylesheet" href="./style.css" />
  
</head>

<body>


  <section id="contact-me" class="contact">
    <div class="contact__wrap">

      <!-- LEFT -->
      <div class="contact__left">
        <h2 class="contact__title">Get in touch</h2>

        <p class="contact__desc">
          Have a project in mind? Looking to partner or work together?
          Reach out through the form and I’ll get back to you in the next 48 hours.
        </p>

        <div class="contact__info">
          <a class="contact__infoRow" href="mailto:rohit19soni98@gmail.com">
            <span class="contact__icon" aria-hidden="true">✉️</span>
            <span>rohit19soni98@gmail.com</span>
          </a>

          <a class="contact__infoRow" href="tel:+917350925201">
            <span class="contact__icon" aria-hidden="true">📞</span>
            <span>+91 73509 25201</span>
          </a>
        </div>
      </div>

      <!-- RIGHT -->
      <div class="contact__right">
        <form class="contactForm" action="#" method="post" autocomplete="on">
          <div class="contactForm__grid2">
            <label class="field">
              <span class="field__label">First Name <span class="req">*</span></span>
              <input class="field__input" type="text" name="firstName" placeholder="Ex: Alex" required>
            </label>

            <label class="field">
              <span class="field__label">Last Name <span class="req">*</span></span>
              <input class="field__input" type="text" name="lastName" placeholder="Ex: Doe" required>
            </label>
          </div>

          <label class="field">
            <span class="field__label">Phone Number <span class="req">*</span></span>
            <input class="field__input" type="tel" name="phone" placeholder="Ex: 1234 567 890" required>
          </label>

          <label class="field">
            <span class="field__label">Email Address <span class="req">*</span></span>
            <input class="field__input" type="email" name="email" placeholder="Ex: yourmail@gmail.com" required>
          </label>

          <label class="field">
            <span class="field__label">Service you want <span class="req">*</span></span>
            <select class="field__input field__select" name="service" required>
              <option value="" disabled selected>Select a service</option>
              <option>Design Strategy</option>
              <option>UI/UX Design</option>
              <option>Website Development</option>
              <option>Landing Page</option>
              <option>Branding</option>
            </select>
          </label>

          <div class="contactForm__actions">
            <button class="sendBtn" type="submit">
              <span>SEND</span>
              <span class="sendBtn__icon" aria-hidden="true">➜</span>
            </button>
          </div>
        </form>
      </div>

    </div>
  </section>


  <div id="menu">
    <div id="menuhopin">
      <nav class="footerMenu glassmorphism" >
        <a class="footerMenu__link" href="index.html">Home</a>
        <a class="footerMenu__link" href="index.html#services">Services</a>
        <a class="footerMenu__link" href="projects.html">Projects</a>
        <a class="footerMenu__link" href="blog.html">Blog</a>
        <a class="footerMenu__link" href="contact.html">Contact Me</a>
      </nav>
    </div>
  </div>
  <!-- Navigation Menu Script -->
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      document.addEventListener('scroll', function () {
        let y = window.scrollY;
        let menuhopin = document.getElementById('menuhopin');
        if (y > 80) { // adjust scroll threshold
          menuhopin.classList.add('headershow');
        } else {
          menuhopin.classList.remove('headershow');
        }
      });
    });
  </script>
  <!-- 1. Include the Lenis library -->
  <script src="https://unpkg.com/lenis@1.3.16/dist/lenis.min.js"></script>

  <!-- 2. Initialize and run Lenis -->
  <script>
    // Initialize Lenis with basic options
    const lenis = new Lenis({
      duration: 1.2,
      easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)), // default easing function
      direction: 'vertical', // vertical, horizontal
      gestureDirection: 'vertical', // vertical, horizontal, both
      smooth: true,
      wheelMultiplier: 1,
      touchMultiplier: 2,
      infinite: false,
    });

    // Use requestAnimationFrame (raf) loop to constantly update the scroll animation
    function raf(time) {
      lenis.raf(time);
      requestAnimationFrame(raf);
    }

    // Start the animation frame loop
    requestAnimationFrame(raf);

    // Optional: Listen for scroll events to log data or trigger other actions
    lenis.on('scroll', (e) => {
      // console.log(e);
    });
  </script>
  <script src="Assets/footer.js"></script>
  <script src="./script.js" defer></script>
</body>

</html>
