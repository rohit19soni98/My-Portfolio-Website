<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Projects</title>

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Questrial&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v6.5.1/css/all.css">
  <link rel="stylesheet" href="https://unpkg.com/lenis@1.3.16/dist/lenis.css">

  <!-- CSS -->
  <link rel="stylesheet" href="Assets/styles.css" />
  <link rel="stylesheet" href="./style.css" />

</head>

<body>

  <header class="container">
    <h1>Projects</h1>
    <p class="muted">Selected work & case studies</p>
  </header>

  <main class="container">
    <section class="projects-grid" id="projectsGrid"></section>
  </main>


  <div id="menu">
    <div id="menuhopin">
      <nav class="footerMenu glassmorphism">
        <a class="footerMenu__link" href="index.html">Home</a>
        <a class="footerMenu__link" href="index.html#services">Services</a>
        <a class="footerMenu__link" href="projects.html">Projects</a>
        <a class="footerMenu__link" href="blog.html">Blog</a>
        <a class="footerMenu__link" href="contact.html">Contact Me</a>
      </nav>
    </div>
  </div>
  <!-- Navigation Menu Script -->
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      document.addEventListener('scroll', function () {
        let y = window.scrollY;
        let menuhopin = document.getElementById('menuhopin');
        if (y > 80) { // adjust scroll threshold
          menuhopin.classList.add('headershow');
        } else {
          menuhopin.classList.remove('headershow');
        }
      });
    });
  </script>
  <!-- 1. Include the Lenis library -->
  <script src="https://unpkg.com/lenis@1.3.16/dist/lenis.min.js"></script>

  <!-- 2. Initialize and run Lenis -->
  <script>
    // Initialize Lenis with basic options
    const lenis = new Lenis({
      duration: 1.2,
      easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)), // default easing function
      direction: 'vertical', // vertical, horizontal
      gestureDirection: 'vertical', // vertical, horizontal, both
      smooth: true,
      wheelMultiplier: 1,
      touchMultiplier: 2,
      infinite: false,
    });

    // Use requestAnimationFrame (raf) loop to constantly update the scroll animation
    function raf(time) {
      lenis.raf(time);
      requestAnimationFrame(raf);
    }

    // Start the animation frame loop
    requestAnimationFrame(raf);

    // Optional: Listen for scroll events to log data or trigger other actions
    lenis.on('scroll', (e) => {
      // console.log(e);
    });
  </script>
  <script src="Assets/footer.js"></script>
  <script src="./script.js" defer></script>
  <script src="Assets/blogs-data.js"></script>
  <script src="Assets/blog-list.js"></script>
  <script src="Assets/projects-data.js"></script>
  <script src="Assets/project-list.js"></script>

</body>

</html>
