<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Blog Detail</title>
    <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Questrial&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v6.5.1/css/all.css">
  <link rel="stylesheet" href="https://unpkg.com/lenis@1.3.16/dist/lenis.css">
  <!-- CSS -->
  <link rel="stylesheet" href="Assets/styles.css" />
  <link rel="stylesheet" href="./style.css" />
</head>
</head>
<body>

  <header class="container blog-header">
    <a href="blog.html" class="muted">← Back to Blog</a>
    <h1 id="blogTitle">Blog Title</h1>

    <div class="blog-topbar">
      <div id="blogMeta" class="muted"></div>
      <div id="blogCategories" class="categories"></div>
    </div>
  </header>

  <main class="container blog-layout">
    <article id="blogContent" class="blog-content"></article>

    <aside class="blog-aside">
      <div class="toc-card">
        <div class="toc-title">Table of Contents</div>
        <nav id="toc"></nav>
      </div>
    </aside>
  </main>

  <footer class="container blog-footer">
    <div class="prev-next">
      <a id="prevBlog" class="btn link-btn" href="#">← Previous</a>
      <a id="nextBlog" class="btn link-btn" href="#">Next →</a>
    </div>
  </footer>

  <!-- Bottom sticky scroll progress strip -->
  <div class="scroll-progress">
    <div class="scroll-progress__bar" id="progressBar"></div>
    <div class="scroll-progress__label" id="progressLabel">0%</div>
  </div>

  <script src="Assets/blogs-data.js"></script>
  <script src="Assets/blog-detail.js"></script>
</body>
</html>
